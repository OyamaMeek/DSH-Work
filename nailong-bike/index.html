<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#f6f5ec">
<title>奶龙的慢慢骑行 · A little ride</title>
<style>
:root { color-scheme: light; font: 16px/1.6 ui-rounded, "PingFang SC", "Microsoft YaHei", system-ui, sans-serif; color: #354c3f; background: #f6f5ec; }
* { box-sizing: border-box; }
body { margin: 0; min-height: 100svh; }
main { max-width: 1320px; margin: auto; padding: 40px 48px 24px; }
header { display: flex; justify-content: space-between; align-items: center; gap: 24px; }
.brand { display: flex; gap: 12px; align-items: center; font-size: 14px; font-weight: 650; letter-spacing: .08em; }
.brand-icon { display: grid; place-items: center; width: 36px; height: 36px; background: #e8eddb; border-radius: 50%; }
.edition { color: #7b8679; font-size: 11px; letter-spacing: .17em; }
.intro { text-align: center; margin: 48px 0 -8px; position: relative; z-index: 1; }
.eyebrow { margin: 0 0 14px; color: #7a8a6b; font-size: 11px; letter-spacing: .3em; font-weight: 600; }
h1 { font-size: clamp(29px, 4vw, 48px); line-height: 1.3; letter-spacing: .055em; margin: 0 0 14px; font-weight: 700; }
.intro p:last-child { color: #83907d; font-size: 14px; letter-spacing: .12em; margin: 0; }
.scene { margin: 0; position: relative; }
.scene > svg { display: block; width: 100%; height: auto; overflow: visible; }
.controls { display: flex; justify-content: center; align-items: center; flex-wrap: wrap; gap: 16px; margin: 2px 0 22px; }
button, select { font: inherit; font-size: 13px; color: #405746; border: 1px solid #dce2d2; border-radius: 40px; background: #fdfcf6; min-height: 44px; }
button { padding: 0 24px; cursor: pointer; display: flex; align-items: center; gap: 10px; transition: background .16s, transform .12s; }
button:hover { background: #eaf0df; }
button:active { transform: scale(.96); }
button:focus-visible, select:focus-visible { outline: 3px solid #799862; outline-offset: 4px; }
select { padding: 0 32px 0 16px; cursor: pointer; }
.speed-label { font-size: 12px; color: #7d8977; }
#play-icon { font-size: 11px; width: 12px; display: inline-block; }
footer { display: flex; justify-content: space-between; border-top: 1px solid #e1e5d8; padding-top: 20px; font-size: 11px; color: #8d9686; letter-spacing: .08em; gap: 16px; }
footer .note { display: flex; align-items: center; gap: 7px; }
.dot { width: 6px; height: 6px; background: #94ab79; border-radius: 50%; }
.sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; border: 0; }
@media (max-width: 640px) { main { padding: 24px 20px; } .edition { font-size: 9px; letter-spacing: .08em; } .brand { font-size: 12px; gap: 8px; } .intro { margin-top: 40px; margin-bottom: 12px; } .intro p:last-child { font-size: 12px; letter-spacing: .02em; } .scene { margin-inline: -16px; } .controls { gap: 10px; margin-top: 20px; } footer { font-size: 10px; flex-wrap: wrap; } .speed-label { display: none; } }
@media (prefers-reduced-motion: reduce) { button { transition: none; } }
</style>
</head>
<body>
<main>
<header>
  <div class="brand"><span class="brand-icon" aria-hidden="true">✿</span> 奶龙的散步日记</div>

</header>
<section class="intro" aria-labelledby="heading">
  <p class="eyebrow">A LITTLE RIDE, A LITTLE JOY</p>
  <h1 id="heading">慢慢骑，风景刚刚好。</h1>
  <p>把烦恼留在身后，和奶龙一起兜兜风。</p>

<figcaption class="sr-only">一段适合发呆的田园骑行。动画可以暂停，开启系统减少动态效果时默认静止。</figcaption>

<div class="controls" role="group" aria-label="骑行动画控制">
  <button id="toggle" type="button" aria-pressed="false"><span id="play-icon" aria-hidden="true">Ⅱ</span><span id="toggle-label">歇一小会</span></button>
  <label for="speed" class="speed-label">骑行节奏</label>
  <select id="speed" aria-label="骑行节奏"><option value="0.65">慢悠悠 · 0.65×</option><option value="1" selected>刚刚好 · 1×</option><option value="1.5">追追风 · 1.5×</option></select>
</div>
<p id="status" class="sr-only" aria-live="polite"></p>
<footer><span class="note"><span class="dot" aria-hidden="true"></span>今日份快乐：没有目的地</span><span>微风 · 晴天 · 好心情</span></footer>
</main>
<script>
(() => {
  "use strict";
  const byId = id => document.getElementById(id);
  const reducedMotion = matchMedia("(prefers-reduced-motion: reduce)");
  const toggle = byId("toggle");
  const speed = byId("speed");
  const parts = Object.fromEntries(["rider", "torso", "eyes", "tail", "scarf-tail", "wheel-rear", "wheel-front", "crank", "leg-near", "leg-highlight", "leg-far", "foot-near", "pedal-far", "landscape", "foreground", "clouds", "breeze", "shadow"].map(id => [id, byId(id)]));
  let playing = !reducedMotion.matches;
  let elapsed = 0;
  let previous = null;
  let frame = null;
  const transform = (id, value) => parts[id].setAttribute("transform", value);
  function legPath(hip, foot) {
    const dx = foot.x - hip.x, dy = foot.y - hip.y;
    const distance = Math.hypot(dx, dy);
    const upper = 65, lower = 64;
    const along = (upper * upper - lower * lower + distance * distance) / (2 * distance);
    const height = Math.sqrt(Math.max(0, upper * upper - along * along));
    const kneeX = hip.x + along * dx / distance + height * dy / distance;
    const kneeY = hip.y + along * dy / distance - height * dx / distance;
    return `M${hip.x} ${hip.y} L${kneeX} ${kneeY} L${foot.x} ${foot.y}`;
  }
  function render() {
    const t = elapsed, phase = t * Math.PI * 2 / 2.8;
    const bob = Math.sin(phase * 2) * 1.7;
    const crankAngle = phase * 180 / Math.PI;
    const wheelAngle = t * 54;
    const near = { x: 580 + Math.cos(phase) * 27, y: 540 + Math.sin(phase) * 27 };
    const far = { x: 580 - Math.cos(phase) * 27, y: 540 - Math.sin(phase) * 27 };
    transform("rider", `translate(0 ${Math.sin(phase) * .6})`);
    transform("torso", `translate(0 ${bob})`);
    transform("wheel-rear", `rotate(${wheelAngle})`);
    transform("wheel-front", `rotate(${wheelAngle})`);
    transform("crank", `rotate(${crankAngle} 580 540)`);
    transform("foot-near", `translate(${near.x} ${near.y - 9})`);
    transform("pedal-far", `translate(${far.x} ${far.y})`);
    parts["leg-near"].setAttribute("d", legPath({x: 536, y: 449 + bob}, near));
    parts["leg-highlight"].setAttribute("d", legPath({x: 536, y: 447 + bob}, {x: near.x, y: near.y - 2}));
    parts["leg-far"].setAttribute("d", legPath({x: 535, y: 453 + bob}, far));
    transform("tail", `rotate(${Math.sin(phase - .5) * 3} 504 450)`);
    transform("scarf-tail", `rotate(${Math.sin(t * 3.2) * 4} 519 342)`);
    const blinkPhase = t % 5.7;
    const blink = blinkPhase > 5.37 && blinkPhase < 5.62 ? .12 + .88 * Math.abs(blinkPhase - 5.495) / .125 : 1;
    transform("eyes", `translate(0 ${280 * (1 - blink)}) scale(1 ${blink})`);
    transform("landscape", `translate(${-((t * 16) % 1200)} 0)`);
    transform("foreground", `translate(${-((t * 82) % 1200)} 0)`);
    transform("clouds", `translate(${-((t * 5) % 1200)} 0)`);
    parts.breeze.setAttribute("opacity", String(.35 + .15 * Math.sin(t * 2)));
    parts.shadow.setAttribute("rx", String(226 + Math.sin(phase * 2) * 2));
  }
  function tick(now) {
    frame = null;
    if (!playing || document.hidden) { previous = null; return; }
    if (previous !== null) elapsed += Math.min((now - previous) / 1000, .08) * Number(speed.value);
    previous = now;
    render();
    frame = requestAnimationFrame(tick);
  }
  function schedule() {
    if (frame !== null) cancelAnimationFrame(frame);
    frame = null;
    previous = null;
    if (playing && !document.hidden) frame = requestAnimationFrame(tick);
  }
  function updateControls() {
    toggle.setAttribute("aria-pressed", String(!playing));
    toggle.setAttribute("aria-label", playing ? "暂停骑行动画" : "继续骑行动画");
    byId("play-icon").textContent = playing ? "Ⅱ" : "▶";
    byId("toggle-label").textContent = playing ? "歇一小会" : "继续兜风";
    byId("status").textContent = playing ? "奶龙正在悠闲骑行" : "骑行已暂停";
  }
  toggle.addEventListener("click", () => { playing = !playing; updateControls(); schedule(); });
  speed.addEventListener("change", () => { byId("status").textContent = `骑行节奏：${speed.selectedOptions[0].textContent}`; });
  reducedMotion.addEventListener("change", event => { if (event.matches) { playing = false; updateControls(); schedule(); } });
  document.addEventListener("visibilitychange", schedule);
  render();
  updateControls();
  schedule();
})();
</script>
</body>
</html>
